
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Sneaker Store</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .menu {
            background-color: black;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
        }

        .logo img {
            width: 200px;
            height: 200px;
            object-fit: contain;
        }

        .about a {
            color: white;
            text-decoration: none;
            font-size: 15px;
            transition: 0.3s;
        }

        .about a:hover {
            color: gray;
            font-size: 17px;
        }

        .profile img {
            width: 75px;
            height: 75px;
            object-fit: contain;
        }

    </style>
</head>

<body>

    <div class="menu">

        <div class="logo">
            <img src="logo.png" alt="logo">
        </div>

        <div class="about">
            <a href="about.html">ABOUT</a>
        </div>

        <div class="profile">
            <img src="profil.png" alt="profile">
        </div>

    </div>

</body>
</html>
