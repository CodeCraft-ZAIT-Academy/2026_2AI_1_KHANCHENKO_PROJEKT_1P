<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
}

.menu {
    background-color: black;
    height: 70px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 40px;
}

.logo img {
    width: 200px;
    height: 200px;
    object-fit: contain;
}

.home a {
    color: white;
    text-decoration: none;
    font-size: 15px;
    transition: 0.3s;
}

.home a:hover {
    color: gray;
    font-size: 17px;
}

.profile img {
    width: 75px;
    height: 65px;
    object-fit: contain;
}
.about a {
    color: white;
    text-decoration: none;
    font-size: 15px;
    transition: 0.3s;
}

.about a:hover {
    color: gray;
    font-size: 17px;
}
</style>
<body>
    <div class="menu">
        <div class="logo">
            <img src="logo.png" alt="logo">
        </div>
        <div class="home">
            <a href="index.html">HOME</a>
        </div>
        <div class="about">
            <a href="about.html">ABOUT</a>
        </div>
        <div class="profile">
            <img src="profil.png" alt="profile">
        </div>
    </div>
</body>
</html>
